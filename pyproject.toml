[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "pandarallel>=1.6.5",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"
